[project]
name = "obsidian-graph-rag"
version = "0.1.0"
description = "A small GraphRAG service: generic ingest API, SQLite graph + FTS5 + sqlite-vec, HippoRAG-2-style retrieval. No LLM calls."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.3",
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.scripts]
graphrag = "graphrag_service.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag_service"]

[tool.pytest.ini_options]
testpaths = ["tests", "skills/kb-tools"]
